[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flower-classification"
version = "1.0.0"
description = "Simplified flower classification MLOps project"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["app/tests", "app"]
python_files = ["test_*.py"]